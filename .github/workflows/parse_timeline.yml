name: Update Timeline

permissions:
  contents: write

on:
  push:
    paths:
      - 'timeline/**'
  workflow_dispatch:

jobs:
  update-timeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Run process_timeline.py
        run: python backend/process_timeline.py

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Force add and commit data.json
        run: |
          if [ -f "data.json" ]; then
            git add -f data.json
            if git diff --staged --quiet; then
              echo "No changes in data.json to commit."
            else
              git commit -m "Update data.json with timestamp [skip ci]"
              git push origin HEAD:main
            fi
          else
            echo "data.json not found, skipping commit."
          fi
