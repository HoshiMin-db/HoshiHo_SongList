name: Get YouTube Comments

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: getcomment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade \
            "google-api-python-client==2.166.0" \
            "google-auth==2.35.0" \
            "google-auth-oauthlib==1.2.1" \
            "google-auth-httplib2==0.2.0" \
            "pytz==2024.2"

      - name: Configure Git Identity
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Check and Fetch Comments
        run: python backend/getcomment.py

      - name: Check Deleted Videos
        run: python backend/check_deleted_videos.py

      - name: Commit and Push changes
        run: |
          git add timeline/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update timeline files and exceptions.txt [skip ci]"
            git push origin HEAD:main
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trigger-parse-timeline:
    needs: check-and-fetch
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - name: Trigger parse_timeline workflow
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'HoshiMin-db',
              repo: 'HoshiHo_SongList',
              workflow_id: 'parse_timeline.yml',
              ref: 'main'
            });
